# CH32V003F4P6 — WCH-LinkE debugging
#
# WCH-LinkE connects to PD1/SWIO and common ground.
# The target board is powered separately.
#
# This configuration is for the WCH-modified OpenOCD
# with the wlinke adapter driver, not stock OpenOCD.

# Select the WCH-LinkE USB debug adapter.
adapter driver wlinke

# Start with the slower 400 kHz connection for reliability.
# Increase later if debugging works consistently.
adapter speed 400

# WCH's single-wire serial debug interface.
# This is not conventional JTAG or ARM SWD.
transport select sdi

# WCH flash address mapping used by this OpenOCD driver.
wlink_set_address 0x00000000

# Create the RISC-V debug access point.
set _CHIPNAME wch_riscv
sdi newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x00001

# Create the debugger's representation of the CPU.
set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME.0 wch_riscv -chain-position $_TARGETNAME

# CH32V003 SRAM starts at 0x20000000.
#
# Do not reserve a work area yet. The MCU has only 2 KB SRAM
# and we do not need a flash programming work area for
# the initial GDB connection test.
set _FLASHNAME $_CHIPNAME.flash

# Define the on-chip flash bank for the WCH flash driver.
flash bank $_FLASHNAME wch_riscv 0x00000000 0 0 0 $_TARGETNAME.0